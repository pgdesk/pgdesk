{{- define "error" -}}
{{ template "head" .Base }}
<div class="pg-error">
  <h1>{{ .Status }} {{ .StatusText }}</h1>
  <p>{{ .Message }}</p>
  {{- if .RequestID }}
  <p class="pg-error-ref">Reference: <code>{{ .RequestID }}</code></p>
  {{- end }}
  <p><a href="{{ .Base.BasePath }}/">Return to admin home</a></p>
</div>
{{ template "foot" .Base }}
{{- end -}}
