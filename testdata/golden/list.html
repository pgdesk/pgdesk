  </div>
  <div class="pg-list-header-actions">

    <a class="pg-btn pg-btn-primary" href="/admin/users/new">Add User</a>
  </div>
</div>
<div class="pg-filterbar">
  <input type="checkbox" id="pg-filter-toggle" class="pg-filter-toggle">
  <label for="pg-filter-toggle" class="pg-btn pg-filter-trigger">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>

  </label>
  <form class="pg-filters" method="get" action="/admin/users"><div class="pg-filter">
  <label for="pg-f-f_status">Status</label>
  <select id="pg-f-f_status" name="f_status">
    <option value="" selected>Any</option>
    <option value="active">active</option>
  </select>
</div>
    <div class="pg-filter pg-filter-actions">
      <button type="submit">Apply</button>
      <a class="pg-btn" href="/admin/users">Reset</a>
    </div>
  </form>
  <div class="pg-chips" aria-label="Active filters">
    <a class="pg-chip" href="/admin/users">
      <span class="pg-chip-key">Status:</span>&nbsp;&lt;script&gt;alert(&#39;x&#39;)&lt;/script&gt;
      <span class="pg-chip-x" aria-hidden="true">&#215;</span><span class="pg-sr-only">Remove Status filter</span>
    </a>
  </div>
</div>
<form method="post" action="/admin/users/action" class="pg-action-form">
  <input type="hidden" name="_pgdesk_csrf" value="CSRF">

  </div>

  <thead>
    <tr><th class="pg-check-col"><input type="checkbox" data-select-all aria-label="Select all"></th>

</table></form>
