name: Question
description: Not sure how to do something, or whether pgdesk can.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you've tried
      description: Code, docs you've read, or anything else that helps.
