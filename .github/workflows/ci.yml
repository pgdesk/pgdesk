name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  build-and-lint:
    name: Build, vet, format, static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: gofmt (must be empty)
        run: |
          fmtout="$(gofmt -l .)"
          if [ -n "$fmtout" ]; then
            echo "Files not gofmt'd:"; echo "$fmtout"; exit 1
          fi
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        # staticcheck needs a newer Go than ours to build; setup-go sets GOTOOLCHAIN=local.
        run: |
          GOTOOLCHAIN=auto go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  unit-race:
    name: Unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test -race
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...

  fuzz-smoke:
    name: Fuzz smoke (D3 resolver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: fuzz identifier resolver briefly
        run: go test -run=- -fuzz=FuzzResolveColumn -fuzztime=30s ./internal/query || true

  integration:
    name: Integration (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["12", "14", "16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: pgdesk
          POSTGRES_DB: pgdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGDESK_TEST_DSN: postgres://postgres:pgdesk@localhost:5432/pgdesk_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: integration tests
        run: go test -tags=integration -race ./...
